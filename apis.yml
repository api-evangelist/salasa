name: Salasa
description: Salasa is an end-to-end eCommerce logistics provider based in Saudi Arabia,
  offering 3PL fulfillment (warehouse storage, automated pick/pack/ship), hyperlocal
  dark stores with 2-hour delivery in Riyadh, domestic on-demand and scheduled shipping,
  cross-border shipping with customs clearance, and reverse logistics / return management.
  Its Operations Management System (OMS) provides real-time tracking, inventory management,
  and analytics, and it connects to major eCommerce platforms (Salla, Zid, Shopify,
  WooCommerce, Magento, Amazon, Trendyol) and offers custom API integrations for merchants
  automating fulfillment and order synchronization.
